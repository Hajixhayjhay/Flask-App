plugin: aws_ec2
regions:
  - us-east-1
filters:
  "tag:Role": "*"
keyed_groups:
  - key: tags.Role
    prefix: tag_Role
hostnames:
  - public-ip-address
compose:
  ansible_user: ec2-user
  ansible_ssh_private_key_file: /home/ec2-user/xapic-key.pem
  ansible_ssh_common_args: '-o StrictHostKeyChecking=no'