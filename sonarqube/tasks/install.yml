- name: Extract SonarQube
  ansible.builtin.unarchive:
    src: "/opt/sonarqube-{{ sonarqube_version }}.zip"
    dest: /opt/
    remote_src: yes

- name: Ensure sonar user exists
  ansible.builtin.user:
    name: sonar
    state: present
    create_home: yes

- name: Set ownership of SonarQube directory
  ansible.builtin.file:
    path: "/opt/sonarqube-{{ sonarqube_version }}"
    state: directory
    recurse: yes
    owner: sonar
    group: sonar

- name: Create systemd service for SonarQube
  copy:
    dest: /etc/systemd/system/sonar.service
    content: |
      [Unit]
      Description=SonarQube service
      After=syslog.target network.target

      [Service]
      Type=forking
      ExecStart=/opt/sonarqube-{{ sonarqube_version }}/bin/linux-x86-64/sonar.sh start
      ExecStop=/opt/sonarqube-{{ sonarqube_version }}/bin/linux-x86-64/sonar.sh stop
      User=sonar
      Group=sonar
      Restart=always
      LimitNOFILE=65536
      LimitNPROC=4096

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd to recognize new service
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Start and enable SonarQube service
  ansible.builtin.systemd:
    name: sonar
    state: started
    enabled: yes
