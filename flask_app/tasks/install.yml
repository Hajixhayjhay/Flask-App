- name: Ensure Python3 & pip are installed
  yum:
    name:
      - python3
      - python3-pip
    state: present

- name: Ensure SQLite is installed
  yum:
    name: sqlite
    state: present

- name: Create Python virtual environment
  command: python3 -m venv {{ venv_dir }}
  args:
    creates: "{{ venv_dir }}/bin/activate"

- name: Copy requirements.txt to current (before pip)
  copy:
    src: requirements.txt
    dest: "{{ app_dir }}/current/requirements.txt"
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0644'


- name: Install Python requirements
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/current/requirements.txt"
    virtualenv: "{{ venv_dir }}"
    virtualenv_python: python3

- name: Install boto3 and botocore in virtualenv
  pip:
    name:
      - boto3
      - botocore
    virtualenv: "{{ venv_dir }}"