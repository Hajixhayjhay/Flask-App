- name: Ensure Python3 & pip are installed
  yum:
    name:
      - python3
      - python3-pip
      - unzip
      - tar
    state: present

- name: Ensure SQLite is installed
  yum:
    name: sqlite
    state: present

- name: Create Python virtual environment
  command: python3 -m venv {{ venv_dir }}
  args:
    creates: "{{ venv_dir }}/bin/activate"

  
- name: Install boto3 and botocore in virtualenv
  pip:
    name:
      - boto3
      - botocore
    virtualenv: "{{ venv_dir }}"
