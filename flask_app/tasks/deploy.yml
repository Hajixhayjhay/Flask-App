# Ensure base directories
- name: Ensure base directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/releases"
    - "{{ app_dir }}/instance"
    - "/var/log/flaskapp"

# Temporary extraction dir
- name: Ensure temporary extraction directory exists
  file:
    path: "/tmp/{{ build_id }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'

# Download artifact
- name: Download artifact from S3
  amazon.aws.s3_object:
    bucket: "{{ s3_bucket }}"
    object: "{{ artifact_name }}"
    dest: "/tmp/{{ artifact_name }}"
    mode: get
    region: "us-east-1"
  vars:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python3"

# Extract artifact into temp dir
- name: Extract artifact into temporary directory
  unarchive:
    src: "/tmp/{{ artifact_name }}"
    dest: "/tmp/{{ build_id }}"
    remote_src: yes
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'
    extra_opts:
      - --strip-components=1

# Move extracted content to releases
- name: Move extracted content to release directory
  command: mv "/tmp/{{ build_id }}" "{{ app_dir }}/releases/{{ build_id }}"
  args:
    creates: "{{ app_dir }}/releases/{{ build_id }}"

# Update current symlink
- name: Update current symlink to latest release
  file:
    src: "{{ app_dir }}/releases/{{ build_id }}"
    dest: "{{ app_dir }}/current"
    state: link
    force: yes
