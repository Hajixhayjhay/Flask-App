- name: Clean old files before deploy
  file:
    path: /opt/flaskapp/current
    state: absent

- name: Recreate current release dir
  file:
    path: /opt/flaskapp/current
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Extract artifact into current release
  unarchive:
    src: "/tmp/{{ artifact }}"
    dest: /opt/flaskapp/current
    remote_src: yes
    owner: ec2-user
    group: ec2-user
    mode: '0755'
    extra_opts:
      - --strip-components=1

- name: Create virtualenv if missing
  ansible.builtin.command:
    cmd: python3 -m venv /opt/flaskapp/current/venv
  args:
    creates: /opt/flaskapp/current/venv

- name: Install dependencies
  ansible.builtin.pip:
    requirements: /opt/flaskapp/current/files/requirements.txt
    virtualenv: /opt/flaskapp/current/venv
    virtualenv_python: python3

- name: Restart Flask app service
  ansible.builtin.systemd:
    name: flaskapp
    state: restarted
    enabled: yes
    daemon_reload: yes