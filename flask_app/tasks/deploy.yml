# --- Debug build_id ---
- name: Show build_id
  debug:
    msg: "Deploying build_id={{ build_id }}"

# --- Ensure base directories exist ---
- name: Ensure base directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/releases"
    - "{{ app_dir }}/instance"
    - "/var/log/flaskapp"

# --- Download artifact from S3 ---
- name: Download artifact from S3
  amazon.aws.s3_object:
    bucket: "{{ s3_bucket }}"
    object: "{{ artifact_name }}"
    dest: "/tmp/{{ artifact_name }}"
    mode: get
    region: us-east-1
  vars:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python3"

- name: Fail if artifact was not downloaded
  stat:
    path: "/tmp/{{ artifact_name }}"
  register: artifact_stat

- name: Ensure artifact exists
  fail:
    msg: "Artifact /tmp/{{ artifact_name }} not found!"
  when: not artifact_stat.stat.exists

# --- Prepare release ---
- name: Clean old release directory if exists
  file:
    path: "{{ app_dir }}/releases/{{ build_id }}"
    state: absent

- name: Ensure release directory exists
  file:
    path: "{{ app_dir }}/releases/{{ build_id }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'

- name: Clean old current symlink if exists
  file:
    path: "{{ app_dir }}/current"
    state: absent

# --- Extract artifact ---
- name: Extract artifact into release directory
  unarchive:
    src: "/tmp/{{ artifact_name }}"
    dest: "{{ app_dir }}/releases/{{ build_id }}"
    remote_src: yes
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'
    extra_opts:
      - --strip-components=1
  args:
    creates: "{{ app_dir }}/releases/{{ build_id }}/.extracted"

- name: Touch extracted marker
  file:
    path: "{{ app_dir }}/releases/{{ build_id }}/.extracted"
    state: touch

# --- Update symlink ---
- name: Update current symlink to latest release
  file:
    src: "{{ app_dir }}/releases/{{_
