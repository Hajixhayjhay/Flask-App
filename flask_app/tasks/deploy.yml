- name: Set build_id if not defined
  set_fact:
    build_id: "{{ build_id | default('latest') }}"

- name: Debug build_id
  debug:
    msg: "Deploying build_id={{ build_id }}"

# --- Download artifact from S3 ---
- name: Download artifact from S3
  amazon.aws.s3:
    bucket: "{{ s3_bucket }}"
    object: "{{ artifact_name }}"
    dest: "/tmp/{{ artifact_name }}"
    mode: get
    region: us-east-1
  vars:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python3"

- name: Fail if artifact was not downloaded
  stat:
    path: "/tmp/{{ artifact_name }}"
  register: artifact_stat

- name: Ensure artifact exists
  fail:
    msg: "Artifact /tmp/{{ artifact_name }} not found!"
  when: not artifact_stat.stat.exists

# --- Ensure app directories exist ---
- name: Ensure base directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/releases"
    - "{{ app_dir }}/instance"
    - "/var/log/flaskapp"

# --- Prepare release ---
- name: Clean old release directory if exists
  file:
    path: "{{ app_dir }}/releases/{{ build_id }}"
    state: absent

- name: Clean old current symlink if exists
  file:
    path: "{{ app_dir }}/current"
    state: absent

# --- Extract artifact ---
- name: Extract artifact into release directory
  unarchive:
    src: "/tmp/{{ artifact_name }}"
    dest: "{{ app_dir }}/releases/{{ build_id }}"
    remote_src: yes
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'
    extra_opts:
      - --strip-components=1
  args:
    creates: "{{ app_dir }}/releases/{{ build_id }}"

- name: Update current symlink to latest release
  file:
    src: "{{ app_dir }}/releases/{{ build_id }}"
    dest: "{{ app_dir }}/current"
    state: link

# --- Virtualenv & dependencies ---
- name: Create virtualenv if missing
  ansible.builtin.command:
    cmd: python3 -m venv "{{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}"

- name: Install Python dependencies in virtualenv
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/current/files/requirements.txt"
    virtualenv: "{{ venv_dir }}"
    virtualenv_python: python3

# --- Restart Flask service ---
- name: Restart Flask app service
  ansible.builtin.systemd:
    name: flaskapp
    state: restarted
    enabled: yes
    daemon_reload: yes
