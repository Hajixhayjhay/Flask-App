- name: Ensure app directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/current"
    - "{{ app_dir }}/releases"
    - "{{ app_dir }}/instance"
    - /var/log/flaskapp

# ---------- Artifact download (if using S3) ----------
- name: Download artifact from S3
  aws_s3:
    bucket: "{{ s3_bucket }}"
    object: "{{ artifact_name }}"
    dest: "/tmp/{{ artifact_name }}"
    mode: get

- name: Extract artifact
  unarchive:
    src: "/tmp/{{ artifact_name }}"
    dest: "{{ app_dir }}/releases/{{ build_id }}"
    remote_src: yes

- name: Symlink current release
  file:
    src: "{{ app_dir }}/releases/{{ build_id }}"
    dest: "{{ app_dir }}/current"
    state: link
    force: yes

# ---------- Copy requirements if not using artifact ----------
- name: Copy requirements.txt to current (local deploy)
  copy:
    src: requirements.txt
    dest: "{{ app_dir }}/current/requirements.txt"
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0644'

# ---------- Install pip packages ----------
- name: Install Python requirements
  pip:
    requirements: "{{ app_dir }}/current/requirements.txt"
    virtualenv: "{{ venv_dir }}"
    virtualenv_python: python3


# ---------- Deploy templates ----------
- name: Deploy Flask HTML template
  template:
    src: index.html.j2
    dest: "{{ app_dir }}/current/templates/index.html"
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0644'

# ---------- Initialize SQLite DB ----------
- name: Initialize SQLite database if not exists
  shell: sqlite3 "{{ app_dir }}/current/data.db" < "{{ app_dir }}/current/init_db.sql"
  args:
    creates: "{{ app_dir }}/current/data.db"
  become_user: "{{ flask_user }}"

# ---------- Deploy systemd service ----------
- name: Deploy systemd service
  template:
    src: flaskapp.service.j2
    dest: /etc/systemd/system/flaskapp.service
    mode: '0644'
  notify: restart flaskapp
