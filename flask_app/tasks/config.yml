# ================== Deployment Tasks ==================

# --- Show deployment variables for debugging ---
- name: Show deployment variables
  debug:
    msg:
      - "app_dir={{ app_dir }}"
      - "build_id={{ build_id }}"
      - "flask_user={{ flask_user }}"
      - "venv_dir={{ venv_dir }}"
      - "s3_bucket={{ s3_bucket }}"
      - "artifact_name={{ artifact_name }}"

# --- Ensure base directories exist ---
- name: Ensure base directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/releases"
    - "{{ app_dir }}/instance"
    - "/var/log/flaskapp"

# --- Ensure release folder exists ---
- name: Ensure release folder exists
  file:
    path: "{{ app_dir }}/releases/{{ build_id }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'

# --- Download artifact from S3 ---
- name: Download artifact from S3
  amazon.aws.s3_object:
    bucket: "{{ s3_bucket }}"
    object: "{{ artifact_name }}"
    dest: "/tmp/{{ artifact_name }}"
    mode: get
    region: "us-east-1"
  vars:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python3"

# --- Fail if artifact was not downloaded ---
- name: Fail if artifact was not downloaded
  stat:
    path: "/tmp/{{ artifact_name }}"
  register: artifact_stat

- name: Ensure artifact exists
  fail:
    msg: "Artifact /tmp/{{ artifact_name }} not found!"
  when: not artifact_stat.stat.exists

# --- Extract artifact into release folder ---
- name: Extract artifact
  unarchive:
    src: "/tmp/{{ artifact_name }}"
    dest: "{{ app_dir }}/releases/{{ build_id }}"
    remote_src: yes
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    extra_opts:
      - --strip-components=1

# --- Touch extracted marker ---
- name: Touch extracted marker
  file:
    path: "{{ app_dir }}/releases/{{ build_id }}/.extracted"
    state: touch

# --- Remove old current symlink or directory ---
- name: Remove old current folder if exists
  file:
    path: "{{ app_dir }}/current"
    state: absent

# --- Update current symlink to new release ---
- name: Update current symlink
  file:
    src: "{{ app_dir }}/releases/{{ build_id }}"
    dest: "{{ app_dir }}/current"
    state: link
    force: yes

# --- Deploy Flask templates ---
- name: Deploy Flask templates
  copy:
    src: "{{ item.src }}"
    dest: "{{ app_dir }}/current/templates/{{ item.dest }}"
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0644'
  loop:
    - { src: "files/templates/index.html.j2", dest: "index.html" }

# --- Copy requirements.txt ---
- name: Copy requirements.txt
  copy:
    src: files/requirements.txt
    dest: "{{ app_dir }}/current/requirements.txt"
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0644'

# --- Install Python dependencies in virtualenv ---
- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/current/files/requirements.txt"
    virtualenv: "{{ venv_dir }}"
    virtualenv_python: python3

# --- Initialize SQLite database ---
- name: Initialize SQLite database
  shell: sqlite3 "{{ app_dir }}/current/data.db" < "{{ app_dir }}/current/init_db.sql"
  args:
    creates: "{{ app_dir }}/current/data.db"
  become_user: "{{ flask_user }}"

# --- Restart Flask service ---
- name: Restart Flask app service
  ansible.builtin.systemd:
    name: flaskapp
    state: restarted
    enabled: yes
    daemon_reload: yes
