---
# ================================
# Unified Config + Deploy Tasks
# ================================

# --- Show deployment variables (optional, remove in prod) ---
- name: Show deployment variables
  debug:
    msg:
      - "app_dir={{ app_dir }}"
      - "flask_user={{ flask_user }}"
      - "venv_dir={{ venv_dir }}"
      - "s3_bucket={{ s3_bucket }}"
      - "artifact_name={{ artifact_name }}"

# --- Ensure base directories exist ---
- name: Ensure base directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/releases"
    - "{{ app_dir }}/instance"
    - "/var/log/flaskapp"

# --- Ensure release folder exists ---
- name: Ensure release folder exists
  file:
    path: "{{ app_dir }}/releases/latest"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0755'

# --- Remove old current symlink if exists ---
- name: Remove old current symlink
  file:
    path: "{{ app_dir }}/current"
    state: absent

# --- Download artifact from S3 ---
- name: Download artifact from S3
  amazon.aws.s3_object:
    bucket: "{{ s3_bucket }}"
    object: "{{ artifact_name }}"
    dest: "/tmp/{{ artifact_name }}"
    mode: get
    region: "us-east-1"
  vars:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python3"

# --- Fail if artifact was not downloaded ---
- name: Ensure artifact exists
  stat:
    path: "/tmp/{{ artifact_name }}"
  register: artifact_stat

- name: Fail if artifact missing
  fail:
    msg: "Artifact /tmp/{{ artifact_name }} not found!"
  when: not artifact_stat.stat.exists

# --- Extract artifact into release folder ---
- name: Extract artifact
  unarchive:
    src: "/tmp/{{ artifact_name }}"
    dest: "{{ app_dir }}/releases/latest"
    remote_src: yes
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    extra_opts:
      - --strip-components=1

# --- Touch extracted marker ---
- name: Touch extracted marker
  file:
    path: "{{ app_dir }}/releases/latest/.extracted"
    state: touch

# --- Update current symlink ---
- name: Update current symlink
  file:
    src: "{{ app_dir }}/releases/latest"
    dest: "{{ app_dir }}/current"
    state: link
    force: yes

# --- Deploy Flask HTML template ---
- name: Deploy Flask HTML template
  template:
    src: index.html.j2
    dest: "{{ app_dir }}/current/templates/index.html"
    owner: "{{ flask_user }}"
    group: "{{ flask_user }}"
    mode: '0644'

# --- Initialize SQLite database ---
- name: Initialize SQLite database
  shell: sqlite3 "{{ app_dir }}/current/data.db" < "{{ app_dir }}/current/init_db.sql"
  args:
    creates: "{{ app_dir }}/current/data.db"
  become_user: "{{ flask_user }}"

# --- Deploy systemd service ---
- name: Deploy systemd service
  template:
    src: flaskapp.service.j2
    dest: /etc/systemd/system/flaskapp.service
    mode: '0644'
  notify: restart flaskapp

# --- Install Python dependencies ---
- name: Install Python dependencies in virtualenv
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/current/files/requirements.txt"
    virtualenv: "{{ venv_dir }}"
    virtualenv_python: python3

# --- Restart Flask service ---
- name: Restart Flask app service
  ansible.builtin.systemd:
    name: flaskapp
    state: restarted
    enabled: yes
    daemon_reload: yes
