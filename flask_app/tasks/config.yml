- name: Ensure required system packages are installed
  ansible.builtin.yum:
    name:
      - python3
      - python3-pip
      - sqlite
    state: present

- name: Create app directory
  ansible.builtin.file:
    path: /opt/flask-app
    state: directory
    mode: '0755'

- name: Copy Flask app source code
  ansible.builtin.copy:
    src: app.py
    dest: /opt/flask-app/app.py
    mode: '0755'

- name: Copy init_db.sql
  ansible.builtin.copy:
    src: init_db.sql
    dest: /opt/flask-app/init_db.sql
    mode: '0644'

- name: Initialize SQLite database
  ansible.builtin.shell: sqlite3 "/opt/flask-app/data.db" < "/opt/flask-app/init_db.sql"
  args:
    creates: "/opt/flask-app/data.db"

- name: Copy templates folder
  ansible.builtin.copy:
    src: templates/
    dest: /opt/flask-app/templates/
    mode: '0755'

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: requirements.txt
    dest: /opt/flask-app/requirements.txt
    mode: '0644'

- name: Create Python virtual environment
  ansible.builtin.command: python3 -m venv /opt/flask-app/venv
  args:
    creates: /opt/flask-app/venv/bin/activate

- name: Install dependencies from requirements.txt
  ansible.builtin.pip:
    requirements: /opt/flask-app/requirements.txt
    virtualenv: /opt/flask-app/venv
    virtualenv_command: python3 -m venv

- name: Create systemd service for Flask app
  ansible.builtin.copy:
    dest: /etc/systemd/system/flask-app.service
    content: |
      [Unit]
      Description=Flask App
      After=network.target

      [Service]
      User=ec2-user
      WorkingDirectory=/opt/flask-app
      ExecStart=/opt/flask-app/venv/bin/python /opt/flask-app/app.py
      Restart=always

      [Install]
      WantedBy=multi-user.target
    mode: '0644'

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start Flask app
  ansible.builtin.systemd:
    name: flask-app
    state: started
    enabled: yes