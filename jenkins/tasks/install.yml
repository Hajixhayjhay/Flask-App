---
# roles/jenkins/tasks/install.yml

# Ubuntu / Debian
- name: Install OpenJDK 11 on Ubuntu
  apt:
    name: openjdk-11-jdk
    state: present
    update_cache: yes
  when: ansible_distribution == "Ubuntu"
  become: yes

- name: Download Jenkins GPG key on Ubuntu
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    dest: /usr/share/keyrings/jenkins-keyring.asc
    mode: '0644'
  when: ansible_distribution == "Ubuntu"
  become: yes

- name: Add Jenkins repository on Ubuntu
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present
  when: ansible_distribution == "Ubuntu"
  become: yes

- name: Install Jenkins on Ubuntu
  apt:
    name: jenkins
    state: present
    update_cache: yes
  when: ansible_distribution == "Ubuntu"
  become: yes

- name: Install Java on Amazon Linux / RHEL
  yum:
    name: java-11-amazon-corretto-devel
    state: present
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]
  become: yes

- name: Import Jenkins GPG key on Amazon Linux / RHEL
  rpm_key:
    state: present
    key: https://pkg.jenkins.io/redhat-stable/jenkins.io.key
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]
  become: yes

- name: Add Jenkins repository on Amazon Linux / RHEL
  yum_repository:
    name: jenkins
    description: Jenkins repo
    baseurl: https://pkg.jenkins.io/redhat-stable/
    gpgcheck: yes
    gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io.key
    state: present
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]
  become: yes

- name: Install Jenkins on Amazon Linux / RHEL
  yum:
    name: jenkins
    state: present
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]
  become: yes

- name: Start and enable Jenkins service
  service:
    name: jenkins
    state: started
    enabled: yes
  become: yes
