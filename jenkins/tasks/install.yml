---
# Ubuntu
- name: Download Jenkins GPG key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    dest: /usr/share/keyrings/jenkins-keyring.asc
    mode: '0644'
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: Add Jenkins repository on Ubuntu
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: Install Jenkins and OpenJDK on Ubuntu
  apt:
    name:
      - openjdk-11-jdk
      - jenkins
    state: present
    update_cache: yes
  become: yes
  when: ansible_distribution == "Ubuntu"

# Amazon Linux / RHEL
- name: Import Jenkins GPG key on Amazon Linux
  rpm_key:
    state: present
    key: https://pkg.jenkins.io/redhat-stable/jenkins.io.key
  become: yes
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

- name: Add Jenkins repo on Amazon Linux / RHEL
  yum_repository:
    name: jenkins
    description: Jenkins repo
    baseurl: https://pkg.jenkins.io/redhat-stable/
    gpgcheck: yes
    gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io.key
    state: present
  become: yes
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

- name: Install Jenkins and Java on Amazon Linux / RHEL
  yum:
    name:
      - java-11-amazon-corretto-devel
      - jenkins
    state: present
  become: yes
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# Start Jenkins service
- name: Start Jenkins service
  service:
    name: jenkins
    state: started
    enabled: yes
  become: yes
