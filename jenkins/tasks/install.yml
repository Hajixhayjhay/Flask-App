# ================== Jenkins Role Tasks ==================

# ---------------- Ubuntu Tasks (Jenkins Master) ----------------
- name: Update apt cache (Ubuntu)
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_distribution == "Ubuntu"

- name: Download Jenkins keyring (Ubuntu)
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian/jenkins.io-2023.key
    dest: /usr/share/keyrings/jenkins-keyring.asc
    mode: '0644'
  when: ansible_distribution == "Ubuntu"

- name: Add Jenkins repository (Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian binary/"
    state: present
  when: ansible_distribution == "Ubuntu"

- name: Install Java and Jenkins (Ubuntu)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - openjdk-17-jdk
    - jenkins
    - git
  when: ansible_distribution == "Ubuntu"

# ---------------- Amazon Linux / RHEL Tasks (Jenkins Agent) ----------------

# 1️⃣ Install system dependencies first
- name: Install system dependencies (Python, pip, git, unzip, wget, tar)
  ansible.builtin.yum:
    name:
      - python3
      - python3-pip
      - git
      - unzip
      - wget
      - tar
      - ansible
      - sqlite-devel
    state: present
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# 2️⃣ Update yum cache
- name: Update yum cache (Amazon/RHEL)
  ansible.builtin.yum:
    name: "*"
    state: latest
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# 3️⃣ Install Java 17
- name: Install Java 17 (Amazon/RHEL)
  ansible.builtin.yum:
    name: java-17-amazon-corretto-devel
    state: present
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# 4️⃣ Import Jenkins GPG key
- name: Import Jenkins GPG key (Amazon/RHEL)
  ansible.builtin.rpm_key:
    state: present
    key: https://pkg.jenkins.io/redhat/jenkins.io-2023.key
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# 5️⃣ Add Jenkins repository
- name: Add Jenkins repository (Amazon/RHEL)
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/redhat/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo
    mode: '0644'
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# 6️⃣ Install Jenkins
- name: Install Jenkins (Amazon/RHEL)
  ansible.builtin.yum:
    name: jenkins
    state: present
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# 7️⃣ Install Python packages via pip3
- name: Install Python packages
  ansible.builtin.pip:
    name: "{{ python_packages }}"
    executable: pip3
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# 8️⃣ Install Ansible and boto3
- name: Install Ansible and boto3
  ansible.builtin.pip:
    name: "{{ ansible_packages }}"
    executable: pip3
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# 9️⃣ AWS CLI installation
- name: Download AWS CLI installer
  ansible.builtin.get_url:
    url: "{{ aws_cli_url }}"
    dest: "{{ aws_cli_dest }}"
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

- name: Unzip AWS CLI installer
  ansible.builtin.unarchive:
    src: "{{ aws_cli_dest }}"
    dest: "/tmp/"
    remote_src: yes
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

- name: Install AWS CLI
  ansible.builtin.command:
    cmd: "/tmp/aws/install"
    creates: "/usr/local/bin/aws"
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

- name: Verify AWS CLI installation
  ansible.builtin.command:
    cmd: "aws --version"
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# ---------------- Common Task ----------------
- name: Ensure Jenkins service is enabled and started
  ansible.builtin.systemd:
    name: jenkins
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Jenkins to start
  ansible.builtin.wait_for:
    port: "{{ jenkins_port }}"
    host: "{{ ansible_host | default('127.0.0.1') }}"
    timeout: 120

- name: Ensure virtual environment exists
  pip:
    virtualenv: /home/ec2-user/jenkins/venv
    virtualenv_command: python3 -m venv
    state: present
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

- name: Install pytest and coverage in virtualenv
  pip:
    virtualenv: /home/ec2-user/jenkins/venv
    name:
      - pytest
      - pytest-cov
      - flask
      - "werkzeug<3.1"
      - sqlite3
    state: present
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

  