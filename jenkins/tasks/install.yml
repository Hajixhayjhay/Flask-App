---
# Ubuntu
- name: Add Jenkins repository and key on Ubuntu
  apt_key:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io.key
    state: present
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: Add Jenkins repository on Ubuntu
  apt_repository:
    repo: deb https://pkg.jenkins.io/debian-stable binary/
    state: present
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: Install Jenkins and OpenJDK on Ubuntu
  apt:
    name:
      - openjdk-11-jdk
      - jenkins
    state: present
    update_cache: yes
  become: yes
  when: ansible_distribution == "Ubuntu"

# Amazon Linux / RHEL
- name: Add Jenkins repository on Amazon Linux / RHEL
  yum_repository:
    name: jenkins
    description: Jenkins repo
    baseurl: https://pkg.jenkins.io/redhat-stable/
    gpgcheck: yes
    gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io.key
    state: present
  become: yes
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

- name: Install Jenkins and Java on Amazon Linux / RHEL
  yum:
    name:
      - java-11-amazon-corretto-devel
      - jenkins
    state: present
  become: yes
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# Start Jenkins service
- name: Start Jenkins service
  service:
    name: jenkins
    state: started
    enabled: yes
  become: yes
