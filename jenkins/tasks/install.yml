---
- name: Install and configure Jenkins
  hosts: jenkins_servers
  become: yes
  tasks:

    ##########################
    # Ubuntu / Debian Tasks
    ##########################

    - name: Add Jenkins GPG keyring on Ubuntu
      ansible.builtin.apt_key:
        url: https://pkg.jenkins.io/debian/jenkins.io-2023.key
        state: present
      when: ansible_distribution == "Ubuntu"

    - name: Add Jenkins repository on Ubuntu
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian binary/"
        state: present
      when: ansible_distribution == "Ubuntu"

    - name: Update apt cache on Ubuntu
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_distribution == "Ubuntu"

    - name: Install Jenkins and OpenJDK on Ubuntu
      ansible.builtin.apt:
        name:
          - openjdk-11-jdk
          - jenkins
        state: present
      when: ansible_distribution == "Ubuntu"

    - name: Start and enable Jenkins service on Ubuntu
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: yes
      when: ansible_distribution == "Ubuntu"


    ##########################
    # Amazon Linux / RHEL Tasks
    ##########################

    - name: Ensure wget is installed
      ansible.builtin.dnf:
        name: wget
        state: present
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

    - name: Add Jenkins repository for Amazon Linux / RHEL
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/redhat/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

    - name: Import Jenkins GPG key for Amazon Linux / RHEL
      ansible.builtin.rpm_key:
        state: present
        key: https://pkg.jenkins.io/redhat/jenkins.io-2023.key
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

    - name: Install Jenkins and Java on Amazon Linux / RHEL
      ansible.builtin.dnf:
        name:
          - java-11-amazon-corretto-devel
          - jenkins
        state: present
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

    - name: Start and enable Jenkins service on Amazon Linux / RHEL
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: yes
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]
