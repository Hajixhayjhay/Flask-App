
    # ---------------- Ubuntu Tasks ----------------
    - name: Update apt cache (Ubuntu)
      apt:
        update_cache: yes
      when: ansible_distribution == "Ubuntu"

    - name: Download Jenkins keyring (Ubuntu)
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian/jenkins.io-2023.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'
      when: ansible_distribution == "Ubuntu"
      notify: Restart Jenkins

    - name: Add Jenkins repository (Ubuntu)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian binary/"
        state: present
      when: ansible_distribution == "Ubuntu"
      notify: Restart Jenkins

    - name: Install Java and Jenkins (Ubuntu)
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - openjdk-17-jdk
        - jenkins
      when: ansible_distribution == "Ubuntu"
      notify: Restart Jenkins

    # ---------------- Amazon Linux / RHEL Tasks ----------------
    - name: Update yum cache (Amazon/RHEL)
      yum:
        name: "*"
        state: latest
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

    - name: Install Java 17 (Amazon/RHEL)
      yum:
        name: java-17-openjdk
        state: present
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]
      notify: Restart Jenkins

    - name: Import Jenkins GPG key (Amazon/RHEL)
      ansible.builtin.rpm_key:
        state: present
        key: https://pkg.jenkins.io/redhat/jenkins.io-2023.key
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]
      notify: Restart Jenkins

    - name: Add Jenkins repository (Amazon/RHEL)
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/redhat/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: '0644'
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]
      notify: Restart Jenkins

    - name: Install Jenkins (Amazon/RHEL)
      yum:
        name: jenkins
        state: present
      when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]
      notify: Restart Jenkins

    # ---------------- Common Tasks ----------------
    - name: Ensure Jenkins service is enabled and started
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for Jenkins to start
      ansible.builtin.wait_for:
        port: "{{ jenkins_port }}"
        host: "{{ ansible_host | default('127.0.0.1') }}"
        timeout: 120

 
