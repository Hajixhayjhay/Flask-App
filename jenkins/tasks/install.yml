---
# Jenkins installation tasks

# ---------- Ubuntu ----------
- name: Add Jenkins GPG keyring on Ubuntu
  ansible.builtin.command: >
    curl -fsSL https://pkg.jenkins.io/debian/jenkins.io-2023.key
    | tee /usr/share/keyrings/jenkins-keyring.asc > /dev/null
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: Add Jenkins repo on Ubuntu
  ansible.builtin.command: >
    echo deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian binary/
    | tee /etc/apt/sources.list.d/jenkins.list > /dev/null
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: Update apt cache on Ubuntu
  ansible.builtin.apt:
    update_cache: yes
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: Install Jenkins and OpenJDK on Ubuntu
  ansible.builtin.apt:
    name:
      - openjdk-11-jdk
      - jenkins
    state: present
  become: yes
  when: ansible_distribution == "Ubuntu"

# ---------- Amazon Linux / RHEL ----------
- name: Add Jenkins repo on Amazon Linux / RHEL
  yum_repository:
    name: jenkins
    description: Jenkins repo
    baseurl: https://pkg.jenkins.io/redhat-stable/
    gpgcheck: yes
    gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io.key
    state: present
  become: yes
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

- name: Install Jenkins and Java on Amazon Linux / RHEL
  yum:
    name:
      - java-11-amazon-corretto-devel
      - jenkins
    state: present
  become: yes
  when: ansible_distribution in ["Amazon", "Amazon Linux", "RedHat"]

# ---------- Start Jenkins service ----------
- name: Start and enable Jenkins service
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: yes
  become: yes
